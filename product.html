<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Mount Parche product details" />
    <title>Mount Parche | Product</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="checkout-body">
    <header class="topbar">
      <a class="brand-lockup" href="index.html" aria-label="Mount Parche home">
        <img src="images/mount-parche-logo.svg" class="brand-logo" alt="Mount Parche logo">
        <span>
          <strong>MOUNT PARCHE</strong>
          <small>Shop</small>
        </span>
      </a>
      <a class="button ghost" href="index.html" aria-label="Back to shop">Back to shop</a>
    </header>

    <main class="checkout-page">
      <section class="checkout-shell" aria-labelledby="product-title">
        <div class="product-skeleton" id="product-skeleton" role="status" aria-label="Loading product">
          <div class="product-skeleton-gallery">
            <div class="skeleton-block product-skeleton-image"></div>
          </div>
          <div class="product-skeleton-info" aria-hidden="true">
            <div class="skeleton-block skeleton-category"></div>
            <div class="skeleton-block skeleton-title"></div>
            <div class="skeleton-block skeleton-title skeleton-title-short"></div>
            <div class="skeleton-block skeleton-price"></div>
            <div class="skeleton-block skeleton-description"></div>
            <div class="product-skeleton-benefits">
              <div class="skeleton-block skeleton-benefit"></div>
              <div class="skeleton-block skeleton-benefit"></div>
              <div class="skeleton-block skeleton-benefit"></div>
            </div>
            <div class="skeleton-block skeleton-quantity-label"></div>
            <div class="skeleton-block skeleton-quantity"></div>
            <div class="product-skeleton-actions">
              <div class="skeleton-block skeleton-action"></div>
              <div class="skeleton-block skeleton-action"></div>
            </div>
          </div>
        </div>
        <div class="product-page" id="product-content" hidden>
          <div class="product-gallery">
            <div class="product-image" id="product-image">
              <div class="product-image-placeholder">No image</div>
            </div>
            <div class="product-gallery-controls" id="product-gallery-controls" hidden>
              <button type="button" id="product-image-prev" aria-label="Previous product image">‹</button>
              <span id="product-image-count" aria-live="polite">1 / 1</span>
              <button type="button" id="product-image-next" aria-label="Next product image">›</button>
            </div>
            <div class="product-thumbnails" id="product-thumbnails" aria-label="Product images" hidden></div>
          </div>
          <div class="product-info">
            <span class="eyebrow" id="product-category">Category</span>
            <h1 id="product-title">Product Name</h1>
            <div class="product-price-row" id="product-price-row">
              <div class="product-price" id="product-price">₹0</div>
              <div class="product-mrp" id="product-mrp" hidden></div>
              <div class="product-discount" id="product-discount" hidden></div>
            </div>

            <p id="product-desc">Description</p>

            <div class="product-colors" id="product-colors" hidden>
              <p class="product-color-label">Color: <strong id="selected-color-name"></strong></p>
              <nav class="product-color-options" id="product-color-options" aria-label="Available colors"></nav>
            </div>

            <div class="product-benefits" aria-label="Offers and policies">
              <p class="product-benefit product-online-offer"><span aria-hidden="true">✦</span><span><strong>Pay online and save ₹21</strong></span></p>
              <p class="product-benefit"><span aria-hidden="true">↩</span><span><strong>7 day return policy</strong></span></p>
              <p class="product-benefit" id="product-cod-benefit"><span aria-hidden="true">✓</span><span><strong>Cash on Delivery available</strong></span></p>
            </div>

            <div class="product-sizes" id="product-sizes" hidden>
              <label>Selected size: <strong id="selected-size-name"></strong></label>
              <div class="size-options" id="size-options"></div>
            </div>

            <div class="product-variations" id="product-variations" hidden>
              <label>Selected option: <strong id="selected-variant-name"></strong></label>
              <div class="size-options" id="variant-options" role="group" aria-label="Choose a product option"></div>
            </div>

            <div class="product-stock" id="product-stock"></div>

            <div class="product-qty">
              <label>Quantity</label>
              <div class="qty-controls">
                <button type="button" id="qty-minus" aria-label="Decrease quantity">−</button>
                <input type="number" id="product-qty" value="1" min="1" max="99" />
                <button type="button" id="qty-plus" aria-label="Increase quantity">+</button>
              </div>
            </div>

            <div class="product-actions">
              <button class="button ghost" id="add-to-cart-btn" type="button">
                Add to Cart
              </button>
              <button class="button primary" id="buy-now-btn" type="button">
                Buy Now
              </button>
            </div>
            <p id="add-to-cart-message" style="margin-top:8px;font-size:0.85rem;color:var(--muted);"></p>
          </div>
        </div>
      </section>
    </main>

    <div class="image-lightbox" id="image-lightbox" role="dialog" aria-modal="true" aria-label="Product image preview" hidden>
      <button type="button" class="image-lightbox-close" id="image-lightbox-close" aria-label="Close image preview">×</button>
      <img id="image-lightbox-img" alt="">
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <footer>
      <strong>MOUNT PARCHE</strong>
      <span>Clothes · Accessories · Crockery · More</span>
    </footer>

    <script src="product.js"></script>
  </body>
</html>
